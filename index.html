<!DOCTYPE html>
<html>
<head>
    <title>Contact Us Form</title>
</head>
<body>
    <h2>Contact Us</h2>
<form>
    <label>Full Name:</label>
        <input type="text" name="fullname" placeholder="Enter your name"><br><br>
    <label>Email:</label>
        <input type="email" name="email" placeholder="Enter your email"><br><br>
    <label>Mobile Number:</label>
        <input type="tel" name="mobile" placeholder="Enter mobile number"><br><br>
    <label>Subject:</label>
        <input type="text" name="subject" placeholder="Enter subject"><br><br>
    <label>Message:</label><br>
        <textarea name="message" rows="5" cols="30"
                  placeholder="Enter your message"></textarea><br><br>
    <label>Contact Preference:</label>
        <input type="radio" name="contact" value="email"> Email
        <input type="radio" name="contact" value="phone"> Phone<br><br>
        <input type="submit" value="Send Message">
        <input type="reset" value="Reset">
</form>
</body>
</html>
