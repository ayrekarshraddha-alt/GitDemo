<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
</head>
<body>
<h2>Registration Form</h2>
 <form>
 <label>Full Name:</label>
 <input type="text" name="fullname" placeholder="Enter Full Name"> <br><br>
 <label>Username:</label>
  <input type="text" name="username" placeholder="Enter Username"><br><br>
 <label>Email:</label>
  <input type="email" name="email" placeholder="Enter Email"><br><br>
 <label>Mobile Number:</label>
  <input type="tel" name="mobile" placeholder="Enter Mobile Number"><br><br>
 <label>Password:</label>
  <input type="password" name="password" placeholder="Enter Password"><br><br>
 <label>Confirm Password:</label>
  <input type="password" name="confirm_password" placeholder="Confirm Password"><br><br>
     <label>Gender:</label>
      <input type="radio" name="gender" value="male"> Male
      <input type="radio" name="gender" value="female"> Female
      <input type="radio" name="gender" value="other"> Other<br><br>
 <label>Date of Birth:</label>
   <input type="date" name="dob"><br><br>
 <label>Address:</label>
    <textarea name="address" rows="4" cols="30"
             placeholder="Enter your address"></textarea><br><br>
 <label>City:</label>
      <input type="text" name="city" placeholder="Enter City"><br><br>
 <label>State:</label>
    <input type="text" name="state" placeholder="Enter State"><br><br>
  <input type="checkbox" name="terms">
 <label>I agree to Terms and Conditions</label><br><br>
   <input type="submit" value="Register">
   <input type="reset" value="Reset">
 </form>
</body>
</html>
